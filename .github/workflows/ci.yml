name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    # 自测要 AppKit 离屏渲染（卡片快照），所以必须是 macOS runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Build + selftest
        run: bash scripts/ci-test.sh

      # 不上传 artifact：GitHub 免费额度 500MB 配额一满，整个 job 会被 upload 步骤判红，
      # 与测试结论无关（2026-11-16 实测：PASS 70 / FAIL 0，却因 "Artifact storage quota has been hit" 失败）。
      # 证据文件在仓库里（qa/evidence/），日志留在 run 页面。

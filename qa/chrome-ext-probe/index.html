<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EnglishWriter 扩展探针页</title>
  <style>
    body { font: 16px -apple-system, sans-serif; margin: 32px; max-width: 900px; }
    textarea, #ce { width: 860px; font: 16px -apple-system; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    #ce { min-height: 80px; }
    h3 { margin: 24px 0 8px; }
  </style>
</head>
<body>
  <h3>1) textarea</h3>
  <textarea id="ta" rows="3"></textarea>
  <h3>2) contenteditable（嵌套 <p>：验 DOM Range 兜底路径）</h3>
  <div id="ce" contenteditable="true"><p id="ce-p"></p></div>
  <h3>3) input</h3>
  <input id="in" size="90">
</body>
</html>
